name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Unit test details
      run: ./build/neuracraft_tests

    - name: Benchmark
      run: ./bin/NeuraCraft bench

    - name: Train on the GPU (falls back to CPU without one)
      run: ./bin/NeuraCraft --gpu spiral
