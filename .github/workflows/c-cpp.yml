name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Unit test details
      run: ./build/neuracraft_tests

    - name: Unit tests with the portable Metal kernel
      if: runner.os == 'macOS'
      run: NEURACRAFT_METAL_KERNEL=tiled ./build/neuracraft_tests

    - name: Unit tests with the simdgroup Metal kernel forced
      if: runner.os == 'macOS'
      continue-on-error: true
      run: NEURACRAFT_METAL_KERNEL=simdgroup ./build/neuracraft_tests && NEURACRAFT_METAL_KERNEL=simdgroup ./bin/NeuraCraft bench

    - name: Benchmark
      run: ./bin/NeuraCraft bench

    - name: Train on the GPU (falls back to CPU without one)
      run: ./bin/NeuraCraft --gpu spiral

  cuda-build:
    # Builds the CUDA backend (no GPU on the runner: compile and link only, then the CPU tests).
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
    - name: Tools
      run: apt-get update -qq && apt-get install -y -qq git cmake g++ make > /dev/null
    - uses: actions/checkout@v4
    - name: Build with CUDA
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEURACRAFT_USE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 && cmake --build build --parallel
    - name: Tests (no GPU, so the CPU paths)
      run: ./build/neuracraft_tests

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Clang with libFuzzer and the sanitizers
      timeout-minutes: 15
      run: |
        # The runner's own Clang when it links fuzzers; otherwise apt, with retries and off the
        # Azure mirror (which has stalled for minutes on single packages).
        echo 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long) { return 0; }' > /tmp/probe.cpp
        for cxx in clang++ clang++-20 clang++-19 clang++-18; do
          if command -v $cxx > /dev/null && $cxx -fsanitize=fuzzer,address,undefined /tmp/probe.cpp -o /tmp/probe 2> /dev/null; then
            sudo ln -sf "$(command -v $cxx)" /usr/local/bin/clang++; echo "using $cxx"; exit 0
          fi
        done
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2> /dev/null || true
        APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
        sudo apt-get $APT update && sudo apt-get $APT install -y clang-18 libclang-rt-18-dev && sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
    - name: Fuzz the file readers (30 s each)
      run: fuzz/run.sh 30

  studio-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: Install
      run: npm ci --no-audit --no-fund
    - name: Type check and build
      run: npm run build
